<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=llm-deliberation-app.html">
  <title>LLM Decision Lab</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7f9;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
    }

    main {
      width: min(640px, 100%);
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      line-height: 1.05;
    }

    p {
      color: #647086;
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 8px;
      background: #2868a9;
      color: #ffffff;
      padding: 0 16px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>

  <main>
    <h1>LLM Decision Lab</h1>
    <p>Opening the app. If it does not redirect automatically, launch it below.</p>
